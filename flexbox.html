<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      .el--1 {
        background-color: blueviolet;
      }
      .el--2 {
        background-color: orangered;
      }
      .el--3 {
        background-color: green;
        height: 150px;
      }
      .el--4 {
        background-color: goldenrod;
      }
      .el--5 {
        background-color: palevioletred;
      }
      .el--6 {
        background-color: steelblue;
      }
      .el--7 {
        background-color: yellow;
      }
      .el--8 {
        background-color: crimson;
      }

      .container {
        /* STARTER */
        font-family: sans-serif;
        background-color: #ddd;
        font-size: 40px;
        margin: 40px;

        /* FLEXBOX */
        display: flex;
        align-items: center;
        justify-content: flex-start;
        /* gap: 30px; */
      }

      /* A way to create space but then would need to use psuedo element to remove some margings. Use gap instead. */
      /* .el {
        margin-right: 20px;
      } */

      .el {
        /* DEFAULTS */
        flex-grow: 0;
        flex-shrink: 1;
        flex-basis: auto;

        /* Determines if items can grow to their largest spaces required to fill the container. */

        /* flex-grow: 0;
        /* If not enough space to fit items, flexbox will adjust items by default so that they fit. */
        /* flex-shrink: 1; */
        /* Flex-basis is minimum width of content or length for writing but if more space needed, the items will take it. */
        /* flex-basis: 200px; */ */
      }

      .el--1 {
        align-self: flex-start;
        /* order: 2; */
        flex-grow: 1;
        /* flex: 0 0 200px; This is flex-grow, flex-shrink, and flex-basis. This is best practice and not doing single ones. */
      }

      .el--5 {
        align-self: stretch;
        order: 1;
        /* Flex-grow means 2 times the empty space and the one above 1 times. */
        flex-grow: 2;
      }

      .el--6 {
        order: -1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="el el--1">HTML</div>
      <div class="el el--2">and</div>
      <div class="el el--3">CSS</div>
      <div class="el el--4">are</div>
      <div class="el el--5">amazing</div>
      <div class="el el--6">languages</div>
      <div class="el el--7">to</div>
      <div class="el el--8">learn</div>
    </div>
  </body>
</html>
